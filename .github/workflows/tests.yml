name: Tests

# Run the test suite on every push and pull request.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  schedule:
    # Mondays 06:00 UTC. An advisory is published against code that has not
    # changed, so waiting for the next commit means waiting indefinitely — this
    # repository goes weeks between pushes. A failed scheduled run emails the
    # repository owner, which is the whole point.
    - cron: "0 6 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the runtime: it is what the Lightsail server runs (Ubuntu
        # 24.04) and what the development venv uses. 3.13 guards against
        # future drift. 3.9 was dropped once no machine ran it any more —
        # the laptop's Xcode Python was the only reason it was here.
        python-version: ["3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Check Python syntax
        # Byte-compile every .py file; fails fast on any SyntaxError, no deps needed.
        run: python -m compileall -q .

      - name: Lint (errors + style)
        # Rules and line length come from pyproject.toml [tool.ruff]:
        #   E/W = pycodestyle style (incl. E501 line-too-long, limit 100)
        #   F   = pyflakes real errors (undefined names, bad/unused imports)
        run: |
          pip install ruff
          ruff check .

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Provide a config file for import
        # config/config.yaml is gitignored (holds the live token); the bot module
        # reads it at import time, so tests need a stand-in. The example template
        # carries a placeholder token, which is all the tests require.
        run: cp config/config.yaml.example config/config.yaml

      - name: Run tests
        run: pytest -v

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.12 deliberately, matching the server: the resolver's choice
          # depends on the interpreter. On 3.9 it picks pillow 11.3.0, which
          # has advisories; on 3.12 it picks 12.3.0, which does not. Auditing
          # under the wrong version reports vulnerabilities nobody is running.
          python-version: "3.12"
          cache: pip

      - name: Install production dependencies
        # requirements.txt, not -dev: this asks what the SERVER would install.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit installed packages
        # Freeze first, then audit the frozen list, with pip-audit in a
        # SEPARATE virtualenv. Two mistakes this avoids, both found by trying
        # them on 2026-10-14:
        #
        #   * `pip-audit -r requirements.txt` does NOT resolve transitive
        #     dependencies. Given only deep-translator it reports that package
        #     alone and never looks at urllib3 — which is exactly where three
        #     of the four advisories in the October review actually were. A
        #     freeze lists every installed package by name, so nothing is
        #     missed.
        #   * Installing pip-audit into the SAME environment drags in its own
        #     requests/urllib3, and the audit then reports advisories in the
        #     audit tool rather than in the bot.
        #
        # A failure here BLOCKS MERGING, which is intended: the alternative is
        # finding out months later, by hand, as we did. If an advisory has no
        # fix and the risk has been accepted, add
        #   --ignore-vuln <ID>
        # below WITH A COMMENT saying who accepted it and why. Never silence
        # the whole step.
        run: |
          pip freeze > /tmp/frozen.txt
          python -m venv /tmp/audit-tool
          /tmp/audit-tool/bin/pip install -q pip-audit
          /tmp/audit-tool/bin/pip-audit -r /tmp/frozen.txt --strict --progress-spinner off
